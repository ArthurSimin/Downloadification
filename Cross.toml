# Cross-compilation settings used by the release workflow.
#
# The GUI links against fontconfig directly (X11 / Wayland / xkbcommon are
# loaded at runtime), so the cross containers only need the target-arch
# fontconfig development package to link the GUI binary.

[target.i686-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture i386",
    "apt-get update && apt-get install -y --no-install-recommends libfontconfig1-dev:i386",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture armhf",
    "apt-get update && apt-get install -y --no-install-recommends libfontconfig1-dev:armhf",
]
